name: Format

on:
  push:
    paths:
      - .github/workflows/formatter.yml
      - scipath/**/*.py
      - tests/**/*.py
      - benchmarks/**/*.py

permissions:
  contents: write

jobs:
  format:
    uses: winstxnhdw/actions/.github/workflows/format-python.yml@9a8a1548bdf2fae3fe2f70426f0af4dfef3c38b4 # main
    with:
      recursive-clone: true
