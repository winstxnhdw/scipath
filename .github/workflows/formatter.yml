name: Format

on:
  push:
    paths:
      - .github/workflows/formatter.yml
      - scipath/**/*.py
      - tests/**/*.py
      - benchmarks/**/*.py

permissions:
  contents: write

jobs:
  format:
    uses: winstxnhdw/actions/.github/workflows/format-python.yml@10339f0c31654e18c00d8c7256351ba78bcb2ef7 # main
    with:
      recursive-clone: true
