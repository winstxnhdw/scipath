name: Format

on:
  push:
    paths:
      - .github/workflows/formatter.yml
      - scipath/**/*.py
      - tests/**/*.py
      - benchmarks/**/*.py

permissions:
  contents: write

jobs:
  format:
    uses: winstxnhdw/actions/.github/workflows/format-python.yml@b1d05bbe75975b88a9515ff925939987a1f24db8 # main
    with:
      recursive-clone: true
