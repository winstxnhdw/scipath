name: Format

on:
  push:
    paths:
      - .github/workflows/formatter.yml
      - scipath/**/*.py
      - tests/**/*.py
      - benchmarks/**/*.py

permissions:
  contents: write

jobs:
  format:
    uses: winstxnhdw/actions/.github/workflows/format-python.yml@bfab88ec8f2299aca2069cf92f09d011b65f0889 # main
    with:
      recursive-clone: true
